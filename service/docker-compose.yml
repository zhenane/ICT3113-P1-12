services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # CPU only, intentionally: no GPU passthrough, per the client's hardware constraint.

  ollama-setup:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done

        echo "Pulling candidate models..."
        ollama pull llama3.2:1b
        ollama pull qwen3:1.7b
        ollama pull llama3.2:3b
        ollama pull qwen3:4b

        echo "Candidate models ready:"
        ollama list

  triage-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      DB_PATH: /app/data/tickets.db
      LOG_DIR: /app/logs
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - ollama

volumes:
  ollama_data: